name: build
on: [push, pull_request]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Build mod
        id: build
        run: |
          set +e
          ./gradlew build --console=plain --stacktrace > build.log 2>&1
          status=$?
          tail -n 40 build.log
          if [ "$status" -ne 0 ]; then
            message="$(grep -n -E 'FAILURE:|What went wrong|^> |error:|Execution failed|BUILD FAILED|Caused by:|Exception|Could not' build.log | tail -n 24 | tr '\n' ' ' | cut -c1-3000 | sed 's/%/%25/g; s/\r/%0D/g')"
            if [ -z "$message" ]; then
              message="$(tail -n 24 build.log | tr '\n' ' ' | cut -c1-3000 | sed 's/%/%25/g; s/\r/%0D/g')"
            fi
            echo "::error title=Gradle build failed::$message"
            exit "$status"
          fi
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: pvp20-fabric-26.2
          path: build/libs/*.jar
      - name: Publish direct-download JAR on the session branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/a110658f-mda'
        run: |
          mkdir -p downloads
          if [ -f downloads/pvp20-1.0.0.jar ] && cmp -s downloads/pvp20-1.0.0.jar build/libs/pvp20-1.0.0.jar; then
            echo "Downloadable JAR is already up to date."
            exit 0
          fi
          cp build/libs/pvp20-1.0.0.jar downloads/pvp20-1.0.0.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/pvp20-1.0.0.jar
          git commit -m "Publish PVP20 Fabric 26.2 JAR"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pvp20-build-log
          path: build.log
