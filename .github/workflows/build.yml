name: build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '25'
      - name: Build mod
        id: build
        run: |
          set +e
          ./gradlew build --console=plain --stacktrace > build.log 2>&1
          status=$?
          tail -n 40 build.log
          if [ "$status" -ne 0 ]; then
            message="$(awk '/^FAILURE: Build failed with an exception\./ { show = 1 } show { print; if (/^\* Try:/) exit }' build.log | head -n 24 | tr '\n' ' ' | cut -c1-3000 | sed 's/%/%25/g; s/\r/%0D/g')"
            if [ -z "$message" ]; then
              message="$(head -n 24 build.log | tr '\n' ' ' | cut -c1-3000 | sed 's/%/%25/g; s/\r/%0D/g')"
            fi
            echo "::error title=Gradle build failed::$message"
            exit "$status"
          fi
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: pvp20-fabric-26.2
          path: build/libs/*.jar
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pvp20-build-log
          path: build.log
